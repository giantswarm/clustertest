version: 2.1
orbs:
  architect: giantswarm/architect@10.14.14

jobs:
  test:
    executor: architect/machine
    steps:
      - checkout
      - architect/machine-install-go:
          go_version: 1.27.2
          archive_sha: ecbadb99091a3f46e31f5f934b068b1864eafa7995211b39eaddf76996045fe5
      - run:
          name: Install golangci-lint and nancy
          command: |
            curl --silent --show-error --fail --location https://golangci-lint.run/install.sh | sudo sh -s -- -b /usr/local/bin v2.14.0
            sudo curl --silent --show-error --fail --location https://github.com/sonatype-nexus-community/nancy/releases/download/v2.1.0/nancy-v2.1.0-linux-amd64 --output /usr/local/bin/nancy
            sudo chmod +x /usr/local/bin/nancy
      - architect/go-test

workflows:
  build:
    jobs:
      - test:
          context: architect
          filters:
            tags:
              only: /^v.*/
